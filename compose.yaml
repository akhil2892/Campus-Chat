services:
  mongodb:
    image: mongo:8.2
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - campus-db:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  campus-db:
